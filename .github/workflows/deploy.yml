name: Deploy

# Builds the single-origin production image (backend + built SPA) and redeploys the Railway
# service. Fires on backend pushes, on the frontend repo's repository_dispatch ping (see
# DEPLOY.md for the frontend workflow), and manually.
on:
  push:
    branches: [master]
  repository_dispatch:
    types: [frontend-updated]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Secrets are not directly usable in step `if:`s across all contexts; surface
      # presence as a job env so the Railway step is a clean no-op until DEPLOY.md's
      # provisioning has happened.
      HAS_RAILWAY: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      # Docker rejects uppercase repository names, but github.repository_owner keeps the
      # account's casing (Alp-Balaj) — lowercase it in bash (${var,,}).
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/expensetracker" >> "$GITHUB_ENV"

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      # An empty `gh secret set` paste stores an EMPTY value: the secret then lists fine but
      # expands to "", and checkout fails with "Input required and not supplied: token",
      # which reads like a workflow bug rather than a secret problem. Fail here instead,
      # naming the actual cause. Printing the length is safe — the value stays masked.
      - name: Verify READ_FRONTEND_REPO is present
        env:
          TOK: ${{ secrets.READ_FRONTEND_REPO }}
        run: |
          if [ -z "$TOK" ]; then
            echo "::error::READ_FRONTEND_REPO is unset or empty on Alp-Balaj/ExpenseTracker."
            echo "Re-set it with: printf '%s' \"\$TOKEN\" | gh secret set READ_FRONTEND_REPO --repo Alp-Balaj/ExpenseTracker"
            exit 1
          fi
          echo "READ_FRONTEND_REPO present (${#TOK} chars)"

      # READ_FRONTEND_REPO: a PAT that can READ the expense-tracker-front repo. It is stored
      # here (on the backend repo) because this is where the workflow runs, but it is scoped
      # to the OTHER repo — the name says what it opens, not where it lives.
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/expense-tracker-front
          ref: master
          token: ${{ secrets.READ_FRONTEND_REPO }}
          path: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Redeploy Railway service
        if: env.HAS_RAILWAY == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE_ID" --yes
