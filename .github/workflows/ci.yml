name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ExpenseTracker.sln

      - name: Build
        run: dotnet build ExpenseTracker.sln --no-restore --configuration Release

      # ExpenseTracker.Tests spins up its own Postgres via Testcontainers (one container per
      # test run, see CustomWebApplicationFactory) -- ubuntu-latest runners have Docker
      # preinstalled and it needs no `services:` block or extra connection string secret.
      - name: Test
        run: dotnet test ExpenseTracker.sln --no-build --configuration Release --logger "console;verbosity=normal"
